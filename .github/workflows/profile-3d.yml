name: GitHub-Profile-3D-Contrib

on:
  schedule: # 每天 UTC 18:00 自动运行
    - cron: "0 18 * * *"
  workflow_dispatch: # 支持手动运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v6
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Rename unclassified contributions
        shell: bash
        run: |
          find profile-3d-contrib -type f -name '*.svg' -exec sed -i \
            -e 's/>other</>Docs</g' \
            -e 's/<title>other /<title>Docs /g' \
            -e 's/#444444/#4F75C2/g' {} +
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update 3d contribution graph"
          git push
